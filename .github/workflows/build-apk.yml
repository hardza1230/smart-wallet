name: Build Android APK

# Builds an installable Android APK automatically on every push.
# The heavy Android SDK / Gradle build runs here on GitHub's servers.
# Download the finished .apk from the run's "Artifacts", or from the
# rolling "apk-latest" release.

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OurWallet.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OurWallet-APK
          path: OurWallet.apk

      - name: Publish rolling "latest APK" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          body: "APK ล่าสุด build อัตโนมัติจาก commit ${{ github.sha }}"
          files: OurWallet.apk
